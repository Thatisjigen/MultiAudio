[package]
name = "multiaudio"
version = "0.1.0"
edition = "2021"
description = "Route one audio source to several outputs (Bluetooth + wired) with per-output delay, clock-drift correction and microphone auto-calibration"
license = "GPL-3.0-only"
repository = "https://github.com/Thatisjigen/MultiAudio"

[dependencies]
anyhow = "1"
cpal = "0.18.2"
dirs = "5"
eframe = "0.31"
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# embeds the icon in the Windows .exe (used only when building on Windows)
winresource = "0.1"

[dev-dependencies]
# only for `cargo run --example make_icons`
resvg = { version = "0.50", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-graphics",
    "NSAnimation",
    "NSAnimationContext",
    "NSAppearance",
    "NSBox",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSImage",
    "NSImageView",
    "NSPanel",
    "NSResponder",
    "NSScreen",
    "NSText",
    "NSTextField",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
] }
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.28"
libpulse-simple-binding = "2.28"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Keep audio callbacks fast even in debug builds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
